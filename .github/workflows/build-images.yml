name: Build and Push Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.Replicated_Bootcamp }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/osc135/bootcamp-backend:pr-${{ github.event.number }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/osc135/bootcamp-frontend:pr-${{ github.event.number }}

      - name: Create Replicated release candidate
        uses: replicatedhq/replicated-actions/create-release@main
        with:
          api-token: ${{ secrets.REPLICATED_API_TOKEN }}
          app-slug: bootcamp-halibut
          yaml-dir: .

  build-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.Replicated_Bootcamp }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/osc135/bootcamp-backend:latest
            ghcr.io/osc135/bootcamp-backend:sha-${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/osc135/bootcamp-frontend:latest
            ghcr.io/osc135/bootcamp-frontend:sha-${{ github.sha }}

      - name: Create Replicated release
        id: create-release
        uses: replicatedhq/replicated-actions/create-release@main
        with:
          api-token: ${{ secrets.REPLICATED_API_TOKEN }}
          app-slug: bootcamp-halibut
          yaml-dir: .

      - name: Promote to Unstable channel
        uses: replicatedhq/replicated-actions/promote-release@main
        with:
          api-token: ${{ secrets.REPLICATED_API_TOKEN }}
          app-slug: bootcamp-halibut
          channel-slug: unstable
          release-sequence: ${{ steps.create-release.outputs.release-sequence }}

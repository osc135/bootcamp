name: Build and Push Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_TOKEN }}

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.Replicated_Bootcamp }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/osc135/bootcamp-backend:pr-${{ github.event.number }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/osc135/bootcamp-frontend:pr-${{ github.event.number }}

      - name: Debug - verify files exist
        run: |
          echo "PWD: $(pwd)"
          echo "--- Root files ---"
          ls -la
          echo "--- .replicated contents ---"
          cat .replicated || echo "NOT FOUND"
          echo "--- manifests/ ---"
          ls -la manifests/ || echo "NOT FOUND"
          echo "--- helm/ ---"
          ls -la helm/ || echo "NOT FOUND"

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          curl -Ls "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" -o replicated.tar.gz
          tar xf replicated.tar.gz replicated
          sudo mv replicated /usr/local/bin/
          replicated version

      - name: Create Replicated release candidate
        run: |
          replicated release create --version 0.0.1-pr${{ github.event.number }} --lint

  build-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.Replicated_Bootcamp }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/osc135/bootcamp-backend:latest
            ghcr.io/osc135/bootcamp-backend:sha-${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/osc135/bootcamp-frontend:latest
            ghcr.io/osc135/bootcamp-frontend:sha-${{ github.sha }}

      - name: Debug - verify files exist
        run: |
          echo "PWD: $(pwd)"
          echo "--- Root files ---"
          ls -la
          echo "--- .replicated contents ---"
          cat .replicated || echo "NOT FOUND"
          echo "--- manifests/ ---"
          ls -la manifests/ || echo "NOT FOUND"
          echo "--- helm/ ---"
          ls -la helm/ || echo "NOT FOUND"

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          curl -Ls "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" -o replicated.tar.gz
          tar xf replicated.tar.gz replicated
          sudo mv replicated /usr/local/bin/
          replicated version

      - name: Create Replicated release and promote to Unstable
        run: |
          replicated release create --version 1.0.0-sha${{ github.sha }} --promote unstable --lint

name: Build and Push Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_TOKEN }}

jobs:
  build-images-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.Replicated_Bootcamp }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          platforms: linux/x86_64
          tags: ghcr.io/osc135/bootcamp-${{ matrix.component }}:pr-${{ github.event.number }}

  create-release-pr:
    if: github.event_name == 'pull_request'
    needs: build-images-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - verify files exist
        run: |
          echo "PWD: $(pwd)"
          echo "--- Root files ---"
          ls -la
          echo "--- .replicated contents ---"
          cat .replicated || echo "NOT FOUND"
          echo "--- manifests/ ---"
          ls -la manifests/ || echo "NOT FOUND"
          echo "--- helm/ ---"
          ls -la helm/ || echo "NOT FOUND"

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          curl -Ls "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" -o replicated.tar.gz
          tar xf replicated.tar.gz replicated
          sudo mv replicated /usr/local/bin/
          replicated version

      - name: Package Helm chart for release
        run: |
          helm package helm/ -u -d manifests/
          ls -la manifests/

      - name: Create Replicated release candidate
        run: |
          replicated --debug release create --app 3DMMbzkr9ZBOwosuUy0ydnUVc2w --version 0.0.1-pr${{ github.event.number }} --lint --yaml-dir ./manifests

  build-images-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.Replicated_Bootcamp }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          platforms: linux/x86_64
          tags: |
            ghcr.io/osc135/bootcamp-${{ matrix.component }}:latest
            ghcr.io/osc135/bootcamp-${{ matrix.component }}:sha-${{ github.sha }}

  create-release:
    if: github.event_name == 'push'
    needs: build-images-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - verify files exist
        run: |
          echo "PWD: $(pwd)"
          echo "--- Root files ---"
          ls -la
          echo "--- .replicated contents ---"
          cat .replicated || echo "NOT FOUND"
          echo "--- manifests/ ---"
          ls -la manifests/ || echo "NOT FOUND"
          echo "--- helm/ ---"
          ls -la helm/ || echo "NOT FOUND"

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install Replicated CLI
        run: |
          version=$(curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest | grep -m1 -Po '"tag_name":\s*"v\K[^"]+')
          curl -Ls "https://github.com/replicatedhq/replicated/releases/download/v${version}/replicated_${version}_linux_amd64.tar.gz" -o replicated.tar.gz
          tar xf replicated.tar.gz replicated
          sudo mv replicated /usr/local/bin/
          replicated version

      - name: Package Helm chart for release
        run: |
          helm package helm/ -u -d manifests/
          ls -la manifests/

      - name: Create Replicated release and promote to Unstable
        run: |
          replicated --debug release create --app 3DMMbzkr9ZBOwosuUy0ydnUVc2w --version ${{ github.run_number }}.0.0 --promote Unstable --lint --yaml-dir ./manifests

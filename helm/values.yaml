# Default values for budget-tracker
replicaCount: 1

backend:
  image:
    repository: bootcamp-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi
  livenessProbe:
    enabled: true
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /app/data

frontend:
  image:
    repository: bootcamp-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  apiUrl: "http://budget-tracker-backend:8000"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: budget.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: budget-tls
      hosts:
        - budget.local

postgresql:
  enabled: false
  auth:
    username: budgetuser
    password: budgetpass
    database: budgetdb
  primary:
    persistence:
      enabled: true
      size: 1Gi

redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: false

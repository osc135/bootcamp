apiVersion: v1
kind: Service
metadata:
  name: {{ include "budget-tracker.frontend.fullname" . }}
  labels:
    {{- include "budget-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "budget-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

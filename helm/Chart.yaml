apiVersion: v2
name: budget-tracker
description: A Helm chart for the Budget Tracker full-stack app
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "13.2.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.5.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
